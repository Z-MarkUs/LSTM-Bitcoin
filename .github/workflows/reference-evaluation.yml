name: Reference evaluation

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - "src/**"
      - configs/reference.toml
      - "data/**"
      - "evaluation/results/reference-v1/**"
      - .github/workflows/reference-evaluation.yml
      - scripts/compare_reference.py
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce frozen reference run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and the reference Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked reference environment
        run: uv sync --locked --extra lstm
      - name: Verify the checked-in evidence
        run: >-
          uv run --frozen lstm-bitcoin verify
          --run evaluation/results/reference-v1
      - name: Reproduce the reference experiment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/reference-v1 build/reference-v1-plots
          uv run --frozen lstm-bitcoin reproduce \
            --config configs/reference.toml \
            --output build/reference-v1 \
            --plots build/reference-v1-plots
      - name: Verify regenerated provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen lstm-bitcoin verify --run build/reference-v1
          (cd build/reference-v1-plots && sha256sum --check SHA256SUMS)
      - name: Compare regenerated evidence with the published reference
        run: >-
          uv run --frozen python scripts/compare_reference.py
          --allow-dependency-changes
      - name: Upload regenerated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-evaluation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reference-v1/
            build/reference-v1-plots/
          if-no-files-found: error
          retention-days: 30
